name: Security checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  new-secrets:
    name: Scan new commits for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
      - name: Reject secrets introduced by this change
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git cat-file -e "${BASE_SHA}^{commit}"
            range="${BASE_SHA}..HEAD"
          else
            range="-1 HEAD"
          fi
          "${RUNNER_TEMP}/gitleaks-bin/gitleaks" git --redact=100 --no-banner --log-opts="$range" .
