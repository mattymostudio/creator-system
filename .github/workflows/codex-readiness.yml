name: Codex Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  codex-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Codex readiness check
        run: |
          chmod +x scripts/check-codex-readiness.sh
          bash scripts/check-codex-readiness.sh
